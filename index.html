<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070A13" />
    <meta name="format-detection" content="telephone=no" />
    <title>LifePath</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Telegram asks for this script in <head>, before any other script. -->
    <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
    <script>
      // Pick the theme before first paint so the app never flashes the wrong one.
      (function () {
        var theme = 'dark';
        try {
          var ui = JSON.parse(localStorage.getItem('lp:ui') || '{}');
          var wa = window.Telegram && window.Telegram.WebApp;
          var inTg = !!(wa && wa.initData);
          var auto = inTg ? wa.colorScheme : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          theme = ui.theme === 'dark' || ui.theme === 'light' ? ui.theme : auto === 'light' ? 'light' : 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      html { background: #070a13; }
      html[data-theme='light'] { background: #eef2fa; }
      body { margin: 0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot svg { width: 72px; height: 72px; border-radius: 22px; box-shadow: 0 16px 44px rgba(40, 170, 110, 0.42); animation: boot 1.6s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.82; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="LifePath is loading">
        <svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lp-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17614A"/><stop offset="1" stop-color="#0B3127"/></linearGradient><radialGradient id="lp-glow" cx="0.5" cy="0.4" r="0.55"><stop offset="0" stop-color="#3FBF83" stop-opacity="0.45"/><stop offset="1" stop-color="#3FBF83" stop-opacity="0"/></radialGradient><linearGradient id="lp-l" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FD18B"/><stop offset="1" stop-color="#1E9A5E"/></linearGradient><linearGradient id="lp-r" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7EE07F"/><stop offset="1" stop-color="#D2F7A0"/></linearGradient><linearGradient id="lp-stem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FE48A"/><stop offset="1" stop-color="#4DB870"/></linearGradient><linearGradient id="lp-soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A7A5A"/><stop offset="1" stop-color="#1A5543"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#lp-bg)"/><rect width="512" height="512" rx="116" fill="url(#lp-glow)"/><g transform="translate(256 262) scale(1.14) translate(-256 -248)"><ellipse cx="256" cy="372" rx="118" ry="30" fill="url(#lp-soil)"/><path d="M256 372C254 330 252 292 258 244" stroke="url(#lp-stem)" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M252 300C196 306 146 274 132 208C196 196 248 232 252 300Z" fill="url(#lp-l)"/><path d="M260 250C262 176 314 124 394 118C398 198 344 252 260 250Z" fill="url(#lp-r)"/><path d="M296 196C318 170 346 150 372 140" stroke="#fff" stroke-opacity="0.45" stroke-width="12" stroke-linecap="round" fill="none"/></g></svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
