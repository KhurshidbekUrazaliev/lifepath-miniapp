<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070A13" />
    <meta name="format-detection" content="telephone=no" />
    <title>LifePath</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Telegram asks for this script in <head>, before any other script. -->
    <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
    <script>
      // Pick the theme before first paint so the app never flashes the wrong one.
      (function () {
        var theme = 'dark';
        try {
          var ui = JSON.parse(localStorage.getItem('lp:ui') || '{}');
          var wa = window.Telegram && window.Telegram.WebApp;
          var inTg = !!(wa && wa.initData);
          var auto = inTg ? wa.colorScheme : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          theme = ui.theme === 'dark' || ui.theme === 'light' ? ui.theme : auto === 'light' ? 'light' : 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      html { background: #070a13; }
      html[data-theme='light'] { background: #eef2fa; }
      body { margin: 0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot svg { width: 72px; height: 72px; border-radius: 22px; box-shadow: 0 16px 44px rgba(47, 107, 255, 0.5); animation: boot 1.6s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.82; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="LifePath is loading">
        <svg viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <defs><linearGradient id="bg" x1="0" y1="0" x2="72" y2="72"><stop stop-color="#5E9BFF" /><stop offset="1" stop-color="#2A5BEA" /></linearGradient></defs>
          <rect width="72" height="72" rx="22" fill="url(#bg)" />
          <path d="M20 50c8 0 8-14 16-14s8-14 16-14" stroke="#fff" stroke-width="5" stroke-linecap="round" />
          <circle cx="20" cy="50" r="4.5" fill="#fff" /><circle cx="52" cy="22" r="6" fill="#fff" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
