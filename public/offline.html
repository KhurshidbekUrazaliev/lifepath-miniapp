<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />

    <title>LifePath</title>
    <style>
      html, body { margin: 0; height: 100%; background: #070a13; color: #e8ecf6; font-family: system-ui, sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 32px; box-sizing: border-box; }
      img { width: 84px; height: 84px; border-radius: 24px; box-shadow: 0 16px 44px rgba(142, 107, 242, 0.42); }
      h1 { font-size: 22px; margin: 26px 0 8px; }
      p { color: #9aa4bd; line-height: 1.5; margin: 6px 0; }
      button { margin-top: 26px; border: 0; border-radius: 16px; padding: 15px 30px; font: 600 16px system-ui, sans-serif; color: #fff; background: linear-gradient(180deg, #5f9bff, #2f66f6); }
    </style>
  </head>
  <body>
    <main>
      <div>
        <img src="/icon.svg" alt="" />
        <h1>Internet kerak · Internet needed</h1>
        <p>LifePath birinchi marta ochilishi uchun internet kerak. Keyin internetsiz ham ishlaydi.</p>
        <p>LifePath needs the internet the first time it opens. After that it works offline too.</p>
        <p>Для первого запуска LifePath нужен интернет. Потом он работает и без него.</p>
        <button onclick="location.replace('https://lifepath.khurshidbekdev.workers.dev/')">Qayta urinish · Try again</button>
      </div>
    </main>
  </body>
