<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="640" height="640">
  <!-- The bot's profile photo: the app icon, full bleed, because Telegram crops it to a circle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5E9BFF"/>
      <stop offset="1" stop-color="#2A5BEA"/>
    </linearGradient>
    <radialGradient id="shine" cx="22" cy="14" r="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="72" height="72" fill="url(#bg)"/>
  <rect width="72" height="72" fill="url(#shine)"/>
  <path d="M20 50c8 0 8-14 16-14s8-14 16-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="20" cy="50" r="4.5" fill="#fff"/>
  <circle cx="52" cy="22" r="6" fill="#fff"/>
</svg>
